        <h2>Entre em Contato:</h2>


<div class="MargemLabel">
    
    <form action="">
        
            <label for="nome"><Div class="FundoGoldCont">Nome:</Div></label><br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu Nome Completo" required><br><br>
        
            <label for="email"><div class="FundoGoldCont">E-mail:</div></label><br>
            <input type="email" id="email" name="email" placeholder="Digite seu gmail Pessoal ou Comercial" required><br><br>
        
            <label for="telefone"><div class="FundoGoldCont">Telefone:</div></label><br>
            <input type="tel" id="telefone" name="telefone" placeholder="Digite seu Número de Telefone" required><br><br>
        
            <label for="assunto"><div class="FundoGoldCont">Assunto:</div></label><br>
            <input type="text" id="assunto" name="assunto" required><br><br>
        
            <label for="mensagem"><div class="FundoGoldCont">Mensagem:</div></label><br>
            <textarea id="mensagem" name="mensagem" rows="5" cols="30" required></textarea><br><br>
        
            <button style="width: 200px; margin-left: 10px;">Submit</button>
        
        
    </form>
